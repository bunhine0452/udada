<title>우다다</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: a short-form player printed as a riso zine. Each clip = one full-bleed riso illustration (slow push-in like footage),
   outlined kinetic caption in the empty paper, sticker-like rail and creator label. Paper + ink everywhere; colour comes from the prints. */
:root {
  --paper: #EBE8E2;
  --paper-2: #F5F3EF;
  --ink: #1A1A1A;
  --ink-2: #5E5B55;
  --rule: #CFCBC2;
  --pink: #FF48B0;
  --blue: #0078BF;
  --yellow: #FFE800;
  --f: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --spring: cubic-bezier(.22,.9,.24,1);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: #D9D5CD; color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
#app { height: 100%; max-width: 440px; margin: 0 auto; position: relative; overflow: hidden; background: var(--paper); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
/*__BGCSS__*/
.print { position: absolute; inset: -2%; background-size: cover; background-position: 50% 100%; background-color: var(--paper); animation: push 26s ease-in-out infinite alternate; transform-origin: 60% 85%; }
@keyframes push { from { transform: scale(1) } to { transform: scale(1.07) translate(-1%, -1%) } }

/* outlined short-form caption */
.cap { font-weight: 900; color: #fff; letter-spacing: -0.02em;
  text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 2px 2px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 0 6px 0 var(--ink); }

/* ---------- Compose ---------- */
.compose { height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-block: 14px 22px; }
.cbar { display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
.logo { font-weight: 900; font-size: 1.4rem; letter-spacing: -0.05em; }
.logo i { font-style: normal; color: var(--pink); }
.chipx { font-family: var(--mono); font-size: 0.72rem; font-weight: 600; border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px 10px; }
.compose h1 { margin: 0; font-weight: 900; font-size: 2rem; line-height: 1.2; letter-spacing: -0.04em; text-wrap: balance; }
.compose h1 mark { background: linear-gradient(transparent 58%, var(--yellow) 58% 92%, transparent 92%); color: inherit; padding: 0 2px; }
.compose .sub { margin: -6px 0 0; color: var(--ink-2); font-size: 0.9rem; }
textarea#dumpText { width: 100%; min-height: 180px; flex: none; resize: none; border: 1.5px solid var(--ink); border-radius: 16px; background: var(--paper-2); color: var(--ink); padding: 14px 16px; font: 500 1.04rem/1.7 var(--f); box-shadow: 0 3px 0 var(--ink); transition: box-shadow .15s, transform .15s; }
textarea#dumpText::placeholder { color: #A5A198; }
textarea#dumpText:focus { outline: none; box-shadow: 0 3px 0 var(--pink); border-color: var(--ink); }
.lbl { font-family: var(--mono); font-size: 0.7rem; font-weight: 600; color: var(--ink-2); letter-spacing: 0.04em; margin-bottom: -10px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1.5px solid var(--ink); border-radius: 12px; overflow: hidden; }
.seg button { border: 0; border-left: 1.5px solid var(--ink); background: transparent; padding: 9px 2px; font-size: 0.86rem; font-weight: 700; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.primary { border: 0; border-radius: 14px; height: 56px; background: var(--ink); color: var(--paper-2); font-weight: 900; font-size: 1.05rem; letter-spacing: -0.02em; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .15s var(--spring); }
.primary:active { transform: translateY(2px); }
.primary:disabled { opacity: .5; }
.primary .k { font-family: var(--mono); font-size: 0.8rem; color: var(--yellow); }
.textbtn { align-self: center; background: none; border: 0; color: var(--ink); font-size: 0.86rem; font-weight: 500; padding: 4px 8px; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1.5px solid var(--ink); background: var(--yellow); border-radius: 14px; padding: 10px 10px 10px 14px; }
.banner b { font-size: 0.86rem; font-weight: 700; }
.banner button { border: 0; border-radius: 10px; background: var(--ink); color: var(--paper-2); font-weight: 900; padding: 8px 12px; white-space: nowrap; }
.preview { display: grid; gap: 8px; }
.preview .lbl { margin: 0; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.thumb { position: relative; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; background: var(--paper); max-width: 100%; border: 1px solid rgba(26,26,26,.12); }
.thumb .print { animation: none; inset: 0; }
.thumb .tc { position: absolute; left: 6px; right: 6px; top: 30%; transform: translateY(-50%); text-align: center; font-size: 0.8rem; line-height: 1.25; font-weight: 900; color: #fff;
  text-shadow: 1.5px 0 0 var(--ink), -1.5px 0 0 var(--ink), 0 1.5px 0 var(--ink), 0 -1.5px 0 var(--ink), 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 0 2.5px 0 var(--ink); }
.thumb .tv { position: absolute; left: 5px; top: 5px; display: flex; align-items: center; gap: 2px; font-family: var(--mono); font-size: 0.62rem; font-weight: 600; background: var(--paper-2); border: 1px solid var(--ink); border-radius: 999px; padding: 0 6px 0 4px; }
.thumb .tv svg { width: 9px; height: 9px; fill: var(--ink); }

/* ---------- Feed ---------- */
.feed { position: absolute; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; background: var(--paper); }
.card { position: absolute; inset: 0; overflow: hidden; transition: transform .46s var(--spring); will-change: transform; }
.card.nxt { transform: translateY(100%); }
.feed.go .cur { transform: translateY(-100%); }
.feed.go .nxt { transform: translateY(0); }
.feed.skip .cur { transform: translateX(-100%); }
.feed.skip .nxt { transform: translateY(0); }
.feed.drag .card { transition: none; }

.capwrap { position: absolute; left: 0; right: 0; top: 33%; transform: translateY(-50%); text-align: center; padding: 0 26px; pointer-events: none; }
.capwrap .cap { margin: 0; font-size: clamp(2.05rem, 9.8vw, 2.7rem); line-height: 1.24; text-wrap: balance; }
.cap .w { display: inline-block; animation: wpop .44s var(--spring) both; }
.cap .w.hl { color: var(--hl, var(--yellow)); }
@keyframes wpop { 0% { transform: scale(.4) translateY(12px) rotate(-4deg); opacity: 0 } 70% { transform: scale(1.08) } 100% { transform: none; opacity: 1 } }
.hint { display: inline-block; margin-top: 20px; font-family: var(--mono); font-size: 0.72rem; font-weight: 600; background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: 999px; padding: 4px 10px; animation: fadein .6s 1.1s both; }
@keyframes fadein { from { opacity: 0 } }

.top { position: absolute; z-index: 6; left: 0; right: 0; top: 0; padding-top: 10px; display: grid; gap: 10px; pointer-events: none; }
.top > * { pointer-events: auto; }
.bars { display: flex; gap: 3px; }
.bars i { flex: 1; height: 3px; border-radius: 2px; background: rgba(26,26,26,.18); overflow: hidden; }
.bars i.on { background: var(--ink); }
.bars i.now b { display: block; height: 100%; width: 0; background: var(--ink); }
.tb { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.tl0 { font-family: var(--mono); font-size: 0.72rem; font-weight: 600; }
.tabs { grid-column: 2; display: flex; gap: 18px; font-size: 1.02rem; font-weight: 900; }
.tabs button { background: none; border: 0; padding: 4px 0; color: rgba(26,26,26,.4); position: relative; }
.tabs button.sel { color: var(--ink); }
.tabs button.sel::after { content: ""; position: absolute; left: 28%; right: 28%; bottom: -1px; height: 3px; border-radius: 2px; background: var(--ink); }
.tr { grid-column: 3; justify-self: end; display: flex; gap: 6px; align-items: center; }
.ticket { border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px 9px; background: var(--yellow); color: var(--ink); font-weight: 900; font-size: 0.74rem; }
.iconbtn { border: 0; background: none; padding: 4px; display: grid; place-items: center; }
.iconbtn svg { width: 26px; height: 26px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.combo { position: absolute; z-index: 6; left: max(16px, env(safe-area-inset-left, 0px)); top: 56px; font-weight: 900; font-size: 0.8rem; background: var(--ink); color: var(--paper-2); border-radius: 999px; padding: 3px 10px; transform: rotate(-3deg); }
.combo b { color: var(--yellow); font-family: var(--mono); }

.rail { position: absolute; z-index: 4; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 132px; display: grid; gap: 14px; justify-items: center; }
.rb { border: 0; background: none; padding: 0; width: 58px; display: grid; justify-items: center; gap: 3px; font-size: 0.7rem; font-weight: 900; }
.rb .ic { position: relative; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: var(--paper-2); border: 1.5px solid var(--ink); box-shadow: 0 2px 0 var(--ink); transition: transform .18s var(--spring), box-shadow .18s; }
.rb:active .ic { transform: translateY(2px); box-shadow: 0 0 0 var(--ink); }
.rb svg { width: 25px; height: 25px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rb .lab { text-shadow: 0 0 3px var(--paper-2), 0 0 3px var(--paper-2), 0 0 6px var(--paper-2); }
.rb.done .ic { width: 58px; height: 58px; background: var(--ink); }
.rb.done svg { stroke: var(--paper-2); width: 30px; height: 30px; stroke-width: 2.6; }
.rb em { position: absolute; top: -4px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--pink); color: #fff; font-style: normal; font-family: var(--mono); font-size: 0.64rem; display: grid; place-items: center; border: 1.5px solid var(--ink); }
.rb:disabled { opacity: .45; }

.info { position: absolute; z-index: 4; left: max(12px, env(safe-area-inset-left, 0px)); right: 84px; bottom: 22px; display: grid; gap: 6px; padding: 10px 12px; background: rgba(245,243,239,.92); border: 1.5px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink); pointer-events: none; }
.who { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 0.95rem; min-width: 0; }
.av { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--hl, var(--pink)); color: var(--ink); font-weight: 900; font-size: 0.78rem; border: 1.5px solid var(--ink); }
.who .ct { font-family: var(--mono); font-weight: 600; font-size: 0.74rem; color: var(--ink-2); }
.who .ex { font-family: var(--mono); font-size: 0.62rem; font-weight: 600; border: 1px solid var(--ink); border-radius: 5px; padding: 0 4px; }
.desc { font-family: var(--mono); font-size: 0.76rem; font-weight: 500; }
.desc .over { background: var(--yellow); font-weight: 600; padding: 0 3px; }
.track { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 500; overflow: hidden; border-top: 1px dashed var(--rule); padding-top: 6px; }
.track svg { width: 13px; height: 13px; flex: none; fill: var(--ink); }
.marq { overflow: hidden; white-space: nowrap; mask-image: linear-gradient(90deg, #000 85%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); }
.marq span { display: inline-block; padding-right: 36px; animation: marq 12s linear infinite; }
@keyframes marq { from { transform: translateX(0) } to { transform: translateX(-50%) } }
.disc { position: absolute; z-index: 4; right: max(18px, env(safe-area-inset-right, 0px)); bottom: 30px; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle, var(--hl, var(--pink)) 0 30%, var(--ink) 31% 100%); border: 1.5px solid var(--ink); animation: spin 5s linear infinite; font-family: var(--mono); font-size: 0.5rem; font-weight: 600; color: var(--ink); }
@keyframes spin { to { transform: rotate(360deg) } }
.scrub { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(26,26,26,.14); }
.scrub span { display: block; height: 100%; width: 0; background: var(--ink); transition: width 1s linear; }

/* completion burst */
.burst { position: absolute; z-index: 20; width: 0; height: 0; pointer-events: none; }
.burst .core { position: absolute; left: -48px; top: -48px; width: 96px; height: 96px; border-radius: 50%; background: var(--pink); border: 2.5px solid var(--ink); box-shadow: 0 5px 0 var(--ink); display: grid; place-items: center; animation: core .6s var(--spring) both; }
.burst .core svg { width: 52px; height: 52px; fill: none; stroke: var(--paper-2); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .3s .12s ease-out forwards; }
.burst .core.crit { background: var(--yellow); }
.burst .core.crit svg { stroke: var(--ink); }
.burst i { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--pink)); border: 1.5px solid var(--ink); animation: ray .6s ease-out both; }
.burst .xp { position: absolute; left: -90px; width: 180px; top: 60px; text-align: center; font-size: 1.6rem; animation: xpup .9s ease-out both; }
.burst .xp small { display: block; font-size: 0.85rem; }
@keyframes core { 0% { transform: scale(0) rotate(-20deg) } 55% { transform: scale(1.12) rotate(4deg) } 100% { transform: scale(1) rotate(0) } }
@keyframes draw { to { stroke-dashoffset: 0 } }
@keyframes ray { 0% { transform: rotate(var(--a)) translateX(30px) scale(1); opacity: 1 } 100% { transform: rotate(var(--a)) translateX(100px) scale(.3); opacity: 0 } }
@keyframes xpup { 0% { transform: translateY(10px); opacity: 0 } 25% { opacity: 1 } 100% { transform: translateY(-6px); opacity: 1 } }

/* ---------- Full-bleed states ---------- */
.stage { position: absolute; inset: 0; overflow: hidden; }
.stage .over { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding-block: 18% 24px; }
.stage .cap.xl { font-size: clamp(2.5rem, 12vw, 3.3rem); line-height: 1.15; margin: 0; }
.stage .cap.clock { font-family: var(--mono); font-weight: 600; font-size: clamp(4.6rem, 25vw, 6.6rem); line-height: 1; margin: 0; letter-spacing: -0.04em; }
.tag { font-family: var(--mono); font-size: 0.74rem; font-weight: 600; background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px 10px; }
.note2 { margin: 0; font-weight: 700; font-size: 0.92rem; max-width: 30ch; background: rgba(245,243,239,.9); border-radius: 10px; padding: 6px 10px; }
.breath { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--ink); background: var(--yellow); animation: br 9s ease-in-out infinite; }
@keyframes br { 0% { transform: scale(.5) } 22% { transform: scale(.85) } 33% { transform: scale(1) } 100% { transform: scale(.5) } }
.pill { border: 1.5px solid var(--ink); border-radius: 999px; background: var(--paper-2); padding: 9px 16px; font-weight: 700; box-shadow: 0 2px 0 var(--ink); }
.stage .bottom { margin-top: auto; display: grid; gap: 10px; width: 100%; max-width: 360px; }
.nextcard { background: rgba(245,243,239,.94); border: 1.5px solid var(--ink); border-radius: 14px; padding: 10px 14px; text-align: left; display: grid; gap: 2px; box-shadow: 0 3px 0 var(--ink); }
.nextcard small { font-family: var(--mono); font-size: 0.68rem; color: var(--ink-2); font-weight: 600; }
.nextcard b { font-size: 1rem; font-weight: 900; }
.fine { font-size: 0.74rem; font-weight: 500; color: var(--ink-2); background: rgba(245,243,239,.9); border-radius: 8px; padding: 4px 8px; margin: 0; }

/* ---------- Done (profile grid) ---------- */
.done { height: 100%; overflow-y: auto; padding-block: 14px 24px; display: flex; flex-direction: column; gap: 18px; }
.prof { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.bigav { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: 1rem; background: var(--yellow); border: 2px solid var(--ink); box-shadow: 0 0 0 4px var(--paper), 0 0 0 6px var(--pink); }
.pstats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.pstats b { display: block; font-family: var(--mono); font-weight: 600; font-size: 1.25rem; }
.pstats span { font-size: 0.74rem; color: var(--ink-2); }
.done h2 { margin: 0; font-weight: 900; font-size: 1.65rem; letter-spacing: -0.04em; line-height: 1.22; }
.done .sub { margin: -10px 0 0; color: var(--ink-2); font-size: 0.88rem; }
.gridhd { display: flex; justify-content: space-between; align-items: center; border-bottom: 1.5px solid var(--ink); padding-bottom: 8px; font-weight: 900; font-size: 0.88rem; }
.gridhd span { font-family: var(--mono); font-weight: 600; }
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-top: -10px; }
.pgrid .thumb { border-radius: 4px; }
.sec { display: grid; gap: 6px; }
.sec h4 { margin: 0; font-family: var(--mono); font-size: 0.7rem; color: var(--ink-2); font-weight: 600; letter-spacing: 0.04em; }
.plain { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; font-size: 0.9rem; }
.plain small { color: var(--ink-2); }
.ghostbtn { border: 1.5px solid var(--ink); border-radius: 14px; height: 52px; background: transparent; font-weight: 900; font-size: 0.95rem; }

/* ---------- Sheets ---------- */
.sheet-bg { position: absolute; z-index: 30; inset: 0; background: rgba(26,26,26,.35); display: flex; align-items: flex-end; animation: fadein .2s both; }
.sheet { width: 100%; max-height: 86%; overflow-y: auto; background: var(--paper-2); border-top: 1.5px solid var(--ink); border-radius: 20px 20px 0 0; padding-block: 8px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; animation: up .32s var(--spring) both; }
@keyframes up { from { transform: translateY(40%); opacity: .4 } }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--rule); justify-self: center; }
.sheet h3 { margin: 0; font-weight: 900; font-size: 1.2rem; letter-spacing: -0.03em; }
.sheet .note { margin: -10px 0 0; font-size: 0.84rem; color: var(--ink-2); }
.row { display: flex; gap: 8px; }
.sheet input[type=text] { flex: 1; min-width: 0; border: 1.5px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); padding: 11px 13px; font: 500 1rem var(--f); }
.sheet input[type=text]:focus { outline: none; box-shadow: 0 0 0 3px rgba(255,72,176,.35); }
.sbtn { border: 1.5px solid var(--ink); border-radius: 12px; background: var(--ink); color: var(--paper-2); font-weight: 900; padding: 10px 16px; white-space: nowrap; }
.sbtn.alt { background: transparent; color: var(--ink); }
.sbtn.warn { background: var(--pink); color: #fff; }
.sbtn:disabled { opacity: .5; }
.tl { display: grid; grid-template-columns: 10px 1fr; gap: 10px; padding: 10px 12px; background: var(--paper); border-radius: 12px; }
.tl .sw { width: 10px; border-radius: 3px; background: var(--c); border: 1px solid var(--ink); }
.tl b { font-size: 0.95rem; font-weight: 900; }
.tl ol { margin: 4px 0 0; padding-left: 1.2em; display: grid; gap: 2px; font-size: 0.86rem; color: var(--ink-2); }
.tl li.d { text-decoration: line-through; color: #A5A198; }
.tl li small { font-family: var(--mono); font-size: 0.7rem; }
.crisis { background: var(--paper); border-radius: 14px; padding: 14px; display: grid; gap: 8px; border: 1.5px solid var(--ink); }
.crisis .tel { font-family: var(--mono); font-weight: 600; font-size: 1.5rem; color: var(--pink); user-select: all; }

.toast { position: absolute; z-index: 40; left: 50%; top: 92px; transform: translateX(-50%); max-width: calc(100% - 40px); background: var(--ink); color: var(--paper-2); font-size: 0.86rem; font-weight: 700; padding: 9px 16px; border-radius: 999px; text-align: center; animation: tin .3s var(--spring); }
@keyframes tin { from { transform: translate(-50%, -10px); opacity: 0 } }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }

@media (prefers-reduced-motion: reduce) {
  .print, .card, .cap .w, .marq span, .disc, .burst *, .sheet, .toast, .hint, .breath { animation: none !important; transition: none !important; }
  .burst .core svg { stroke-dashoffset: 0; }
}
</style>

<div id="app"></div>

<script>
(function () {
  'use strict';
  var KEY = 'udada.v4';
  /* six riso prints (generated); scene = what kind of task it suits; hl = caption highlight ink */
  var SCENES = [
    { id: 'desk',    hl: '#FF48B0', swatch: '#0078BF' },
    { id: 'phone',   hl: '#FFE800', swatch: '#FFE800' },

  });
  document.addEventListener('keydown', function (e) {
    if (S.phase !== 'feed' || sheet) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'BUTTON') return;
    if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); complete(); }
  });
  /* swipe up = done (current and next move together); double tap = done at the tap point */
  function gestures(feed) {
    var cur = feed.querySelector('.card.cur'), nxt = feed.querySelector('.card.nxt');
    var y0 = null, x0 = 0, dy = 0, lastTap = 0;
    feed.addEventListener('pointerdown', function (e) {
      if (animating || e.target.closest('button, .top')) return;
      y0 = e.clientY; x0 = e.clientX; dy = 0;
      try { feed.setPointerCapture(e.pointerId); } catch (x) {}
    });
    feed.addEventListener('pointermove', function (e) {
      if (y0 === null) return;
      dy = Math.min(0, e.clientY - y0);
      if (dy < -6) {
        feed.classList.add('drag');
        cur.style.transform = 'translateY(' + dy + 'px)';
        if (nxt) nxt.style.transform = 'translateY(' + (feed.clientHeight + dy) + 'px)';
      }
    });
    function reset() { feed.classList.remove('drag'); cur.style.transform = ''; if (nxt) nxt.style.transform = ''; }
    feed.addEventListener('pointerup', function (e) {
      if (y0 === null) return;
      var moved = Math.abs(dy) > 10 || Math.abs(e.clientX - x0) > 10;
      var go = dy < -90; y0 = null; dy = 0;
      if (go) { feed.classList.remove('drag'); complete(); cur.style.transform = ''; if (nxt) nxt.style.transform = ''; return; }
      reset();
      if (moved) return;
      var now = Date.now(), r = feed.getBoundingClientRect();
      if (now - lastTap < 320) { lastTap = 0; complete(e.clientX - r.left, e.clientY - r.top); }
      else lastTap = now;
    });
    feed.addEventListener('pointercancel', function () { if (y0 === null) return; y0 = null; dy = 0; reset(); });
  }
