<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우다다 시안 B — 딩동 017번</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800;900&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
@font-face{font-family:"DSEG7";src:url(https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2) format("woff2")}
/* 은유: 은행·민원실 번호표. 할 일이 '내 차례'로 불린다. 다음 번호 = 다음 클립.
   색: 감열지 흰색 + 검정 잉크 + LED 주황 하나. 바탕은 관공서 민트회색. */
:root{
  --wall:#DCE3DE; --paper:#FBFAF6; --ink:#1B1C1A; --ink2:#73756F; --rule:#C9CCC5;
  --led:#FF7A1A; --ledoff:#3A2516; --panel:#141413;
  --sans:"Gothic A1",system-ui,sans-serif; --mono:"Nanum Gothic Coding",ui-monospace,monospace; --dot:"Galmuri11",monospace; --seg:"DSEG7",monospace;
}
*{box-sizing:border-box;margin:0}
body{background:#BFC7C1;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;padding:40px 32px 64px}
.sheet-h{max-width:1180px;margin:0 auto 36px;display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:end;border-bottom:1.5px solid var(--ink);padding-bottom:14px}
.sheet-h .tag{font:700 12px var(--mono);margin-bottom:8px}
.sheet-h h1{font-size:34px;font-weight:900;letter-spacing:-.04em;line-height:1}
.sheet-h p{font-size:14px;color:#4c4f4a;max-width:520px;line-height:1.55}
.sw{display:flex;gap:6px}.sw i{width:22px;height:22px;border:1px solid #1b1c1a44}
.row{display:flex;gap:44px;justify-content:center;flex-wrap:wrap}
figure{display:grid;gap:14px}
figcaption{font:400 12px var(--mono);color:#4c4f4a}
figcaption b{color:var(--ink)}
.phone{width:360px;height:780px;border-radius:46px;overflow:hidden;position:relative;background:var(--wall);box-shadow:0 0 0 9px #0a0a0a,0 40px 70px -30px rgba(0,0,0,.5)}
.sb{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font:700 14px var(--sans);z-index:5}
.sb.l{color:#eee}

/* LED 패널 */
.panel{background:var(--panel);color:var(--led);padding:52px 18px 14px;position:relative}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 1px,rgba(0,0,0,.35) 1.4px) 0 0/3px 3px}
.marq{font:14px var(--dot);white-space:nowrap;overflow:hidden;border-bottom:1px solid #2a2a28;padding-bottom:10px;text-shadow:0 0 6px rgba(255,122,26,.55)}
.marq span{display:inline-block;animation:marq 14s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}
.nums{display:grid;grid-template-columns:1fr auto;align-items:end;padding-top:10px}
.nums small{display:block;font:11px var(--dot);color:#9a5a28;margin-bottom:4px}
.seg{font:58px/1 var(--seg);position:relative;letter-spacing:.02em;text-shadow:0 0 10px rgba(255,122,26,.6)}
.seg::before{content:attr(data-off);position:absolute;inset:0;color:var(--ledoff);text-shadow:none;z-index:-1}
.seg.s{font-size:34px}
.nums .r{text-align:right}

/* ---------- 1. 용무 적기 ---------- */
.s1{position:absolute;inset:0;padding:60px 20px 20px;display:flex;flex-direction:column;gap:14px}
.hd{display:flex;justify-content:space-between;align-items:baseline}
.logo{font-weight:900;font-size:22px;letter-spacing:-.05em}
.hd small{font:400 11px var(--mono);color:var(--ink2)}
.s1 h2{font-size:30px;font-weight:900;letter-spacing:-.05em;line-height:1.2}
.form{background:var(--paper);border:1.5px solid var(--ink);padding:14px 16px 6px;flex:1}
.form .t{display:flex;justify-content:space-between;font:700 11px var(--mono);border-bottom:1.5px solid var(--ink);padding-bottom:8px;margin-bottom:4px}
.form p{font:400 15.5px/2.15 var(--sans);border-bottom:1px solid var(--rule);display:flex;gap:10px}
.form p i{font:400 11px/2.9 var(--mono);color:var(--ink2);font-style:normal;width:16px}
.chips{display:grid;grid-template-columns:auto repeat(4,1fr);border:1.5px solid var(--ink);background:var(--paper)}
.chips span{font:700 11px var(--mono);padding:11px 10px;border-right:1.5px solid var(--ink);color:var(--ink2)}
.chips b{font:700 13px var(--sans);text-align:center;padding:10px 0;border-right:1px solid var(--rule)}
.chips b:last-child{border-right:0}
.chips b.on{background:var(--ink);color:var(--paper)}
.machine{background:#2A2B29;border-radius:4px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.machine .btn{background:var(--led);color:#1b0f05;font:900 19px var(--sans);letter-spacing:-.03em;padding:16px 14px;border-radius:3px;box-shadow:0 4px 0 #9b4100,inset 0 -2px 0 rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:center}
.machine .btn small{font:700 11px var(--mono)}
.slot{width:62px;height:42px;background:#111;border-radius:2px;position:relative;overflow:visible}
.slot::after{content:"";position:absolute;left:8px;right:8px;top:-22px;height:30px;background:var(--paper);border-bottom:1px dashed #999;animation:print 1.6s ease-out infinite alternate}
@keyframes print{from{transform:translateY(22px)}}

/* ---------- 2. 호출 ---------- */
.s2{position:absolute;inset:0;display:flex;flex-direction:column}
.stage{flex:1;position:relative;padding:22px 22px 0}
.ticket{background:var(--paper);position:relative;padding:18px 20px 30px;box-shadow:0 1px 0 #0000001a,0 18px 30px -18px rgba(0,0,0,.35);transform:rotate(-1.2deg)}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;background:linear-gradient(-45deg,transparent 6px,var(--paper) 6px) 0 0/12px 10px,linear-gradient(45deg,transparent 6px,var(--paper) 6px) 0 0/12px 10px}
.ticket .tt{display:flex;justify-content:space-between;font:400 11px var(--mono);color:var(--ink2)}
.ticket .big{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px}
.ticket .big b{font:900 78px/1 var(--sans);letter-spacing:-.05em}
.ticket .big span{font:700 14px var(--mono)}
.perf{border-top:2px dashed var(--rule);margin:12px -20px}
.ticket h3{font-size:25px;font-weight:800;line-height:1.25;letter-spacing:-.04em;margin-top:2px}
.kv{margin-top:12px;font:400 12.5px/1.9 var(--mono);display:grid;grid-template-columns:auto 1fr;column-gap:14px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;text-align:right}
.bar{margin-top:12px;height:30px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px)}
.queue{position:absolute;left:22px;right:22px;bottom:10px;display:flex;gap:6px;align-items:flex-end}
.queue div{flex:1;background:var(--paper);height:14px;border-top:1.5px solid var(--ink);font:700 9px var(--mono);text-align:center;color:var(--ink2);padding-top:1px}
.queue div:nth-child(1){opacity:1}.queue div:nth-child(n+4){opacity:.55}
.keys{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px;padding:12px 16px 26px;background:#2A2B29}
.keys button{all:unset;background:#3A3B38;color:#E8E8E2;border-radius:3px;text-align:center;padding:12px 0 10px;font:700 13px var(--sans);box-shadow:0 3px 0 #111}
.keys button small{display:block;font:400 10px var(--mono);color:#9a9b95;margin-top:2px}
.keys button.go{background:var(--led);color:#1b0f05;box-shadow:0 3px 0 #9b4100}
.keys button.go small{color:#5a2a05}

/* ---------- 3. 처리 완료 ---------- */
.s3{position:absolute;inset:0;display:flex;flex-direction:column}
.done{flex:1;position:relative}
.spike{position:absolute;left:50%;bottom:130px;width:4px;height:360px;margin-left:-2px;background:#8f928b;border-radius:2px 2px 0 0}
.spike::after{content:"";position:absolute;left:50%;bottom:-14px;width:150px;height:16px;margin-left:-75px;background:#2A2B29;border-radius:3px}
.slip{position:absolute;left:50%;width:236px;margin-left:-118px;background:var(--paper);padding:12px 16px;font:400 12px var(--mono);box-shadow:0 1px 0 rgba(0,0,0,.12),0 6px 10px -6px rgba(0,0,0,.25);display:flex;justify-content:space-between;align-items:center}
.slip::before{content:"";position:absolute;left:50%;top:8px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#555}
.slip span{padding-top:8px}.slip b{padding-top:8px}
.dlab{position:absolute;left:22px;right:22px;top:18px;display:flex;justify-content:space-between;font:400 12px var(--mono);color:var(--ink2)}
.slip.new{display:block;padding:22px 16px 14px}
.slip.new .n{font:900 44px/1 var(--sans);letter-spacing:-.05em}
.slip.new .row2{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.slip b{font:800 13px var(--sans)}
.slip.new{animation:impale .6s cubic-bezier(.3,1.5,.5,1) both}
.slip.new b{font-size:16px}
@keyframes impale{from{transform:translateY(-140px) rotate(-14deg);opacity:0}}
.xp{position:absolute;left:22px;right:22px;bottom:22px;display:flex;justify-content:space-between;align-items:end;border-top:1.5px solid var(--ink);padding-top:10px}
.xp b{font:900 52px/1 var(--sans);letter-spacing:-.05em}
.xp div{text-align:right;font:400 12px/1.7 var(--mono);color:var(--ink2)}
.xp div em{font-style:normal;background:var(--ink);color:var(--led);padding:1px 6px;font-weight:700}
</style>
</head>
<body>
<header class="sheet-h">
  <div><div class="tag">시안 B</div><h1>딩동 017번</h1></div>
  <p>할 일을 고르지 않는다 — <b>내 번호가 불린다</b>. 쏟아내면 번호표가 나오고, 전광판이 다음 할 일을 부른다. 끝낸 번호표는 꽂이에 꽂힌다. 한국 사람이면 누구나 아는 '차례'의 감각.</p>
  <div class="sw"><i style="background:#DCE3DE"></i><i style="background:#FBFAF6"></i><i style="background:#1B1C1A"></i><i style="background:#FF7A1A"></i></div>
</header>
<div class="row">

<figure>
<div class="phone">
  <div class="sb"><span>9:41</span><span>●●●</span></div>
  <div class="s1">
    <div class="hd"><div class="logo">우다다</div><small>오늘 창구 운영 중</small></div>
    <h2>무슨 일로<br>오셨어요?</h2>
    <div class="form">
      <div class="t"><span>용무 신청서</span><span>순서 상관없음</span></div>
      <p><i>01</i>레포트 금요일까지 3장 아직 시작도 안 함</p>
      <p><i>02</i>엄마한테 전화</p>
      <p><i>03</i>방 개판</p>
      <p><i>04</i>택배 반품 언제까지더라</p>
      <p><i>05</i>단톡 답장 안 했음</p>
      <p><i>06</i>&nbsp;</p>
    </div>
    <div class="chips"><span>창구 시간</span><b>30분</b><b class="on">1시간</b><b>2시간</b><b>오늘</b></div>
    <div class="machine">
      <div class="btn">번호표 뽑기<small>▶ 7장</small></div>
      <div class="slot"></div>
    </div>
  </div>
</div>
<figcaption><b>01 용무 신청서</b> — 쏟아내기</figcaption>
</figure>

<figure>
<div class="phone">
  <div class="sb l"><span>9:41</span><span>●●●</span></div>
  <div class="s2">
    <div class="panel">
      <div class="marq"><span>딩동 ♪ 017번 고객님, 지금 바로 처리해 주세요 · 대기 6 · 다음 쉬는 시간까지 1장　　딩동 ♪ 017번 고객님, 지금 바로 처리해 주세요 · 대기 6 · 다음 쉬는 시간까지 1장　　</span></div>
      <div class="nums">
        <div><small>호출 번호</small><div class="seg" data-off="888">017</div></div>
        <div class="r"><small>남은 시간</small><div class="seg s" data-off="8:88">2:21</div></div>
      </div>
    </div>
    <div class="stage">
      <div class="ticket">
        <div class="tt"><span>우다다 · 레포트 창구</span><span>11.04 21:03</span></div>
        <div class="big"><b>017</b><span>번</span></div>
        <div class="perf"></div>
        <h3>레포트 파일 열고<br>제목만 쓰기</h3>
        <dl class="kv">
          <dt>예상</dt><dd>3분</dd>
          <dt>첫 동작</dt><dd>노트북 화면 켜기</dd>
          <dt>연속 처리</dt><dd>3장째 ×1.3</dd>
        </dl>
        <div class="bar"></div>
      </div>
      <div class="queue"><div>018</div><div>019</div><div>020</div><div>021</div><div>022</div><div>023</div></div>
    </div>
    <div class="keys">
      <button class="go">처리 완료<small>↑ 밀기</small></button>
      <button>쪼개기<small>막힘</small></button>
      <button>메모<small>생각남</small></button>
      <button>나중에<small>뒤로</small></button>
    </div>
  </div>
</div>
<figcaption><b>02 호출</b> — 할 일 한 장</figcaption>
</figure>

<figure>
<div class="phone">
  <div class="sb l"><span>9:41</span><span>●●●</span></div>
  <div class="s3">
    <div class="panel">
      <div class="marq"><span>처리 완료 · 수고하셨습니다 · 다음 018번 고객님 준비해 주세요 ·　　처리 완료 · 수고하셨습니다 · 다음 018번 고객님 준비해 주세요 ·　　</span></div>
      <div class="nums">
        <div><small>다음 번호</small><div class="seg" data-off="888">018</div></div>
        <div class="r"><small>오늘 처리</small><div class="seg s" data-off="88">03</div></div>
      </div>
    </div>
    <div class="done">
      <div class="spike"></div>
      <div class="dlab"><span>오늘 꽂은 번호표</span><span>대기 6장</span></div>
      <div class="slip" style="bottom:140px;transform:rotate(5deg)"><span>015 · 택배 반품 접수</span><b>+12</b></div>
      <div class="slip" style="bottom:192px;transform:rotate(-4deg)"><span>016 · 단톡 답장</span><b>+8</b></div>
      <div class="slip new" style="bottom:246px;transform:rotate(2deg)"><div class="n">017</div><div class="row2"><span>레포트 제목 쓰기 · 2분 41초</span><b>+28</b></div></div>
      <div class="xp">
        <b>+28</b>
        <div>기본 14 · 연속 ×1.3<br><em>운 좋은 날 ×2</em></div>
      </div>
    </div>
  </div>
</div>
<figcaption><b>03 처리 완료</b> — 끝냈을 때 보상</figcaption>
</figure>

</div>
</body>
</html>
