schema_version = 1

[workday]
timezone = "Asia/Seoul"
day_starts_at = "00:00"

[session]
inactivity_timeout_minutes = 60
session_resume_grace_minutes = 15

[git]
forbid_journal_for_paths = [
    ".env",
    ".env.*",
    "**/.env",
    "**/.env.*",
    "**/*secret*",
    "**/*credential*",
    "**/*password*",
    "**/*token*",
    "**/*apikey*",
    "**/*api_key*",
    "**/*private_key*",
    "!**/*.rs",
    "!**/*.ts",
    "!**/*.tsx",
    "!**/*.js",
    "!**/*.jsx",
    "!**/*.mjs",
    "!**/*.cjs",
    "!**/*.css",
    "!**/*.scss",
    "!**/*.py",
    "!**/*.go",
    "**/*.pem",
    "**/*.key",
    "**/*.p12",
    "**/*.pfx",
    "**/*.crt",
    "**/*.cer",
    "**/id_rsa",
    "**/id_ed25519",
    "**/.ssh/**",
    "**/.gnupg/**",
    "**/.aws/credentials",
    "**/.aws/config",
    "**/.netrc",
    "**/.npmrc",
    "**/.pypirc",
    "**/.docker/config.json",
    "**/Keychain*",
    "**/keychain*",
]
auto_redact_patterns = []

[watcher]
ignore = [
    ".oculpm/index/",
    ".oculpm/.lock",
    ".git/",
    "node_modules/",
    "target/",
    "dist/",
    ".next/",
    "build/",
    "*.log",
    ".DS_Store",
]
respect_gitignore = true
debounce_ms = 500

[agents]
active = ["agents-md"]
rules_translate = []
template_language = "ko"
